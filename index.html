
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>수달 vs 족제비 AI</title>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      text-align: center;
      padding: 50px 15px;
      margin: 0;
    }

    .container {
      background: white;
      max-width: 450px;
      margin: auto;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 15px #00000015;
    }

    h1 {
      font-size: 26px;
    }

    p {
      color: #666;
    }

    #dropZone {
      border: 2px dashed #888;
      border-radius: 10px;
      padding: 40px 15px;
      cursor: pointer;
      background: #fafafa;
      margin-top: 25px;
    }

    #dropZone.dragover {
      background: #e0efff;
      border-color: #007bff;
    }

    #preview {
      display: none;
      max-width: 100%;
      max-height: 250px;
      margin: 20px auto;
      border-radius: 10px;
    }

    .result {
      margin-top: 20px;
      font-size: 19px;
      font-weight: bold;
    }

    #probabilities {
      text-align: left;
      margin-top: 20px;
    }

    .label {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .bar {
      background: #eee;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 18px;
    }

    .fill {
      height: 15px;
      background: #4a90e2;
      width: 0%;
      transition: width 0.4s;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>🦦 수달 vs 족제비 AI</h1>
    <p>사진을 업로드하면 AI가 동물을 구별합니다.</p>

    <div id="dropZone">
      📁 사진을 드래그하거나 클릭하세요
    </div>

    <input
      type="file"
      id="fileInput"
      accept="image/*"
      hidden
    >

    <img id="preview" alt="업로드한 이미지">

    <div class="result" id="result">
      AI 모델 불러오는 중...
    </div>

    <div id="probabilities"></div>
  </div>

  <script>
    const MODEL_URL =
      "https://teachablemachine.withgoogle.com/models/gqrrAAHKoB/";

    let model = null;
    let requestId = 0;

    const dropZone = document.getElementById("dropZone");
    const fileInput = document.getElementById("fileInput");
    const preview = document.getElementById("preview");
    const result = document.getElementById("result");
    const probabilities = document.getElementById("probabilities");

    // AI 모델 불러오기
    async function init() {
      try {
        model = await tmImage.load(
          MODEL_URL + "model.json",
          MODEL_URL + "metadata.json"
        );

        result.innerText = "AI 준비 완료!";
      } catch (error) {
        result.innerText = "AI 모델을 불러오지 못했습니다.";
        console.error(error);
      }
    }

    // 클릭해서 이미지 선택
    dropZone.onclick = () => {
      fileInput.click();
    };

    fileInput.onchange = (e) => {
      handleFile(e.target.files[0]);
    };

    // 드래그 기능
    dropZone.ondragover = (e) => {
      e.preventDefault();
      dropZone.classList.add("dragover");
    };

    dropZone.ondragleave = () => {
      dropZone.classList.remove("dragover");
    };

    dropZone.ondrop = (e) => {
      e.preventDefault();
      dropZone.classList.remove("dragover");

      handleFile(e.dataTransfer.files[0]);
    };

    // 이미지 분석
    async function handleFile(file) {
      if (!file || !file.type.startsWith("image/")) {
        result.innerText = "이미지 파일을 선택해주세요.";
        return;
      }

      if (!model) {
        result.innerText = "AI 모델이 아직 준비되지 않았습니다.";
        return;
      }

      const currentRequest = ++requestId;
      const imageURL = URL.createObjectURL(file);
      const image = new Image();

      result.innerText = "분석 중...";
      probabilities.innerHTML = "";

      image.onload = async () => {
        try {
          const predictions = await model.predict(image);

          if (currentRequest !== requestId) return;

          predictions.sort(
            (a, b) => b.probability - a.probability
          );

          // 가장 높은 확률의 동물
          const best = predictions[0];
          const bestPercent =
            (best.probability * 100).toFixed(1);

          preview.src = imageURL;
          preview.style.display = "block";

          result.innerText =
            "AI 판단: " + best.className +
            " (" + bestPercent + "%)";

          // 각 동물의 확률 표시
          predictions.forEach((p) => {
            const percent =
              (p.probability * 100).toFixed(1);

            const label = document.createElement("div");
            label.className = "label";

            const name = document.createElement("span");
            name.textContent = p.className;

            const value = document.createElement("span");
            value.textContent = percent + "%";

            label.append(name, value);

            const bar = document.createElement("div");
            bar.className = "bar";

            const fill = document.createElement("div");
            fill.className = "fill";
            fill.style.width = percent + "%";

            bar.appendChild(fill);
            probabilities.append(label, bar);
          });

        } catch (error) {
          if (currentRequest === requestId) {
            result.innerText = "이미지 분석에 실패했습니다.";
          }
          console.error(error);
        } finally {
          URL.revokeObjectURL(imageURL);
        }
      };

      image.onerror = () => {
        if (currentRequest === requestId) {
          result.innerText = "이미지를 불러오지 못했습니다.";
        }
        URL.revokeObjectURL(imageURL);
      };

      image.src = imageURL;
    }

    // 시작
    init();
  </script>
</body>
</html>
